[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canvassheets"
version = "0.1.0"
description = "A pandas-backed, script-first canvas spreadsheet engine. Every recorded action is plain runnable Python."
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pandas>=2.2"]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
test = ["pytest>=8.0"]

[project.scripts]
canvassheets = "canvassheets.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["canvassheets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
